#
# Native/conda layer: geospatial C-library stack + core scientific packages.
# Pure-Python deps and the editable install of pysewer itself live in
# pyproject.toml and are installed with `uv pip install -e '.[dev]'`
# (see bin/bootstrap_env.sh / mk/env.mk).
# GDAL/PROJ/GEOS are intentionally unpinned — conda-forge co-resolves them.
name: pysewer
channels:
  - conda-forge
channel_priority: strict

dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - gdal
  - proj
  - geos
  - libspatialindex
  - rtree
  - rasterio
  - fiona
  - pyogrio
  - geopandas
  - shapely>=2.0
  - pyproj
  - networkx
  - pyarrow
  - matplotlib
  - pyyaml
  - setuptools<81
  - jupyter
  - ipykernel
  - pip
  - uv
  - conda-lock
