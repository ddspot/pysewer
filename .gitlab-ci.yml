#
# Two-layer env in CI: conda layer from the lockfile (deterministic, no
# solve), PyPI layer + editable install via uv.

image: condaforge/miniforge3:latest

variables:
  CONDA_PKGS_DIRS: "$CI_PROJECT_DIR/.conda_pkgs_dir"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv_cache"

cache:
  paths:
    - .conda_pkgs_dir
    - .uv_cache

stages:
  - test
  - deploy
  - mirror

.setup_env: &setup_env
  - mamba create -y -n pysewer --file conda-linux-64.lock
  - source activate pysewer
  - uv pip install --python "$CONDA_PREFIX/bin/python" -e '.[dev,docs]'

test:
  stage: test
  before_script:
    - *setup_env
  script:
    - python -m pytest tests/ -q

lint:
  stage: test
  allow_failure: true
  before_script:
    - *setup_env
  script:
    - ruff check pysewer/ tests/

pages:
  stage: deploy
  before_script:
    - *setup_env
  script:
    - python -m sphinx -b html docs/source public
    - touch public/.nojekyll
  artifacts:
    paths:
      - public
  only:
    - main

# Public docs: codebase Pages is AAI-gated instance-wide, so the same build
# is pushed to the GitHub mirror's gh-pages branch, which GitHub Pages serves
# statically (no GitHub Actions involved). Requires the CI/CD variable
# GITHUB_MIRROR_TOKEN (fine-grained GitHub PAT, contents:write on
# ddspot/pysewer); the job is skipped while the variable is unset.
docs-mirror:
  stage: mirror
  image:
    name: alpine/git:latest
    entrypoint: [""]
  dependencies:
    - pages
  script:
    - cd public
    - git init -b gh-pages
    - git config user.name "codebase-ci"
    - git config user.email "wasp-pysewer-ci@codebase.helmholtz.cloud"
    - git add -A
    # quoted: an unquoted "docs: ..." scalar would YAML-parse as a mapping
    - 'git commit -m "docs: publish sphinx build ($CI_COMMIT_SHORT_SHA)"'
    # tr strips stray whitespace/newlines pasted into the CI variable
    - TOKEN="$(printf '%s' "$GITHUB_MIRROR_TOKEN" | tr -d '[:space:]')"
    # sanity-check the token type before pushing (prints a safe prefix only)
    - |
      case "$TOKEN" in
        github_pat_*|ghp_*) echo "token prefix OK (GitHub PAT), length ${#TOKEN}" ;;
        glpat-*) echo "ERROR: GITHUB_MIRROR_TOKEN is a GitLab token (glpat-...); a GitHub PAT is required"; exit 1 ;;
        *) echo "WARNING: unrecognized token prefix '$(printf '%s' "$TOKEN" | cut -c1-6)...', length ${#TOKEN}" ;;
      esac
    # temporary diagnostics: check the token against the GitHub API
    - apk add --no-cache curl >/dev/null 2>&1 || true
    - 'curl -s -o /dev/null -w "GET /user -> %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/user || true'
    - 'curl -s -o /dev/null -w "GET /repos/ddspot/pysewer -> %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/ddspot/pysewer || true'
    - git push --force "https://ddspot:${TOKEN}@github.com/ddspot/pysewer.git" gh-pages
  only:
    refs:
      - main
    variables:
      - $GITHUB_MIRROR_TOKEN
