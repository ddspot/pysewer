#
# Two-layer env in CI: conda layer from the lockfile (deterministic, no
# solve), PyPI layer + editable install via uv.

image: condaforge/miniforge3:latest

variables:
  CONDA_PKGS_DIRS: "$CI_PROJECT_DIR/.conda_pkgs_dir"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv_cache"

cache:
  paths:
    - .conda_pkgs_dir
    - .uv_cache

stages:
  - test
  - deploy

.setup_env: &setup_env
  - mamba create -y -n pysewer --file conda-linux-64.lock
  - source activate pysewer
  - uv pip install --python "$CONDA_PREFIX/bin/python" -e '.[dev,docs]'

test:
  stage: test
  before_script:
    - *setup_env
  script:
    - python -m pytest tests/ -q

lint:
  stage: test
  allow_failure: true
  before_script:
    - *setup_env
  script:
    - ruff check pysewer/ tests/

pages:
  stage: deploy
  before_script:
    - *setup_env
  script:
    - python -m sphinx -b html docs/source public
    - touch public/.nojekyll
  artifacts:
    paths:
      - public
  only:
    - main

# Public docs: codebase Pages is AAI-gated instance-wide, so the same build
# is pushed to the GitHub mirror's gh-pages branch, which GitHub Pages serves
# statically (no GitHub Actions involved). Requires the CI/CD variable
# GITHUB_MIRROR_TOKEN (fine-grained GitHub PAT, contents:write on
# ddspot/pysewer); the job is skipped while the variable is unset.
docs-mirror:
  stage: deploy
  needs: ["pages"]
  before_script: []
  cache: []
  script:
    - cd public
    - git init -b gh-pages
    - git config user.name "codebase-ci"
    - git config user.email "wasp-pysewer-ci@codebase.helmholtz.cloud"
    - git add -A
    - git commit -m "docs: publish sphinx build ($CI_COMMIT_SHORT_SHA)"
    - git push --force "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/ddspot/pysewer.git" gh-pages
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_MIRROR_TOKEN'
