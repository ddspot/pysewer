#
# Publish to PyPI when a version tag (vX.Y.Z) reaches the GitHub mirror.
# Tags are created on codebase.helmholtz.cloud and mirrored here; PyPI trusted
# publishing (OIDC) does not support self-managed GitLab, so publishing runs on
# the mirror. No API token is stored anywhere.
#
# One-time setup on pypi.org (Account settings -> Publishing -> add a pending
# publisher, or the project's Publishing settings once it exists):
#   PyPI project name: pysewer   owner: ddspot   repository: pysewer
#   workflow: publish.yml        environment: pypi

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"; exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean venv and import it
        run: |
          # Python 3.13: ubuntu-latest (26.04) ships 3.14, for which fiona has
          # no wheels yet, so pip would try to compile it against GDAL
          uv venv --python 3.13 /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/python -c "import pysewer; from importlib.metadata import version; print('pysewer', version('pysewer'))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # GitHub release for the tag, after PyPI accepted the upload: notes are the
  # tag's CHANGELOG section, the wheel and sdist are attached. A release event
  # is also what Zenodo archives (DOI) once the repository is enabled there.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for ${v}"; exit 1; fi
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "pysewer $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
