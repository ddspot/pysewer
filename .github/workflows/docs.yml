#
# Publishes the sphinx docs to GitHub Pages from the GitHub mirror
# (codebase.helmholtz.cloud Pages requires Helmholtz login instance-wide,
# so the public docs live on the mirror).

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Install pysewer with docs extras
        shell: bash -el {0}
        run: |
          python -m pip install uv
          uv pip install --python "$(which python)" -e '.[docs]'
      - name: Build sphinx docs
        shell: bash -el {0}
        run: python -m sphinx -b html docs/source public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
