#
# Test workflow for the GitHub mirror (external contributors); the canonical
# CI runs on codebase.helmholtz.cloud (.gitlab-ci.yml). Runs only on pull
# requests / manual dispatch to conserve Actions minutes — pushes to main are
# already tested on codebase before they are mirrored.

name: Test

on: [pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Install pysewer with dev extras
        shell: bash -el {0}
        run: |
          python -m pip install uv
          uv pip install --python "$(which python)" -e '.[dev]'
      - name: Run tests
        shell: bash -el {0}
        run: python -m pytest tests/ -q
