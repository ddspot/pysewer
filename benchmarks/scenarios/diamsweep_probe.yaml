name: diamsweep_probe
description: >
  Diameter sensitivity (3/3) — DIAGNOSTIC PROBE, not a design. The 0.05/0.08 m
  entries are below any real public-sewer minimum (house-lateral / sub-sewer
  sizes) and are included only to push the smallest offered diameter under the
  flow-binding threshold, proving the sizing engine escalates diameter once a
  pipe finally approaches capacity. Do not read these as recommended sizes.
data:
  dem: tests/test_data/dem.tif
  roads: tests/test_data/roads_clipped.shp
  buildings: tests/test_data/buildings_clipped.shp
  sink: [691350, 2553250]
config:
  optimization:
    tmax: 8.0
    diameters: [0.05, 0.08, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4]
    pressurized_diameter: 0.1
